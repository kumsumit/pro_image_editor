name: example
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  pro_image_editor:
    path: ../
    
  intl: ^0.20.1
  
  bot_toast: ^4.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.3.2
  gal: ^2.3.1
  google_fonts: ^6.2.1
  image: ^4.5.2
  file_saver: ^0.2.14
  firebase_core: ^3.11.0
  firebase_storage: ^12.4.2
  supabase_flutter: ^2.8.3
  image_picker: ^1.1.2
  mime: ^2.0.0
  url_launcher:
    git: https://github.com/kumsumit/url_launcher.git
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  import_sorter: ^4.6.0
  
dependency_overrides: 
  # Fix conflict with supabase
  mime: ^2.0.0
  path_provider:
    git: https://github.com/kumsumit/path_provider.git
  path_provider_windows:
    git: https://github.com/kumsumit/path_provider_windows.git
  path_provider_linux:
    git: https://github.com/kumsumit/path_provider_linux.git
  plugin_platform_interface:
    git: https://github.com/kumsumit/plugin_platform_interface.git
  url_launcher:
    git: https://github.com/kumsumit/url_launcher.git  
  supabase_flutter: ^2.8.3
  shared_preferences:
    git: https://github.com/kumsumit/shared_preferences.git  

flutter:
  uses-material-design: true
  assets:
    - assets/demo.png
    - assets/frame.png
    - assets/frame1.png
    - assets/google_fonts/