name: example
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  pro_image_editor:
    path: ../
    
  intl: ^0.20.1
  
  bot_toast: ^4.1.3
  cupertino_icons: ^1.0.8
  file_picker: 10.3.10
  gal: ^2.3.2
  google_fonts: ^8.0.2
  file_saver: ^0.3.1
  firebase_core: ^4.6.0
  firebase_storage: ^13.2.0
  http: ^1.6.0
  supabase_flutter: ^2.12.1
  image_background_remover: ^2.0.0
  image_picker: ^1.2.1
  mime: ^2.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_colorpicker: ^1.1.0
  vibration: ^3.1.8

  # Video-Editing
  pro_video_editor: ^1.8.0
  audioplayers: ^6.6.0
  ### Choose one player below
  video_player: ^2.11.1
  chewie: ^1.12.1
  flick_video_player: ^0.9.0
  media_kit: ^1.2.6 # Primary package.
  media_kit_video: ^2.0.1 # For video rendering.
  media_kit_libs_video: ^1.0.7 # Native video dependencies.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  import_sorter: ^5.0.0-releasecandidate.1

dependency_overrides: 
  shared_preferences: 
    git: https://github.com/kumsumit/shared_preferences.git
  path_provider:
    git: https://github.com/kumsumit/path_provider.git
  path_provider_windows:
    git: https://github.com/kumsumit/path_provider_windows.git
  path_provider_linux:
    git: https://github.com/kumsumit/path_provider_linux.git
  plugin_platform_interface:
    git: https://github.com/kumsumit/plugin_platform_interface.git  

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/google_fonts/